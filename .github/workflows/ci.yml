name: ci

on:
  push:
    # unit2-wiring is the live integration branch (PRs #10-#14 merged
    # there); excluding it meant merges landed with zero CI — the
    # 2026-07-30 review's finding. NB the nightly cron still cannot
    # fire until workflows exist on the DEFAULT branch (schedule events
    # read main); that resolves at the merge-to-main milestone.
    branches: [main, quantum-tier, unit2-wiring]
  pull_request:
  schedule:
    - cron: "0 7 * * *"   # nightly: re-derive the constitution root, fail on drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Stub the urtext sibling
        # The optional `urtext = { path = "../urtext" }` dep must *resolve* even
        # with the `prose` feature off (cargo reads path-dep manifests during
        # resolution). This job has no cross-repo token, so a stub manifest
        # stands in; the prose feature is never enabled here, so the stub is
        # parsed, not compiled. full-stack.yml checks out the real urtext and is
        # the only CI home of the prose wire. (CI was red from d7ec570 to here.)
        run: |
          mkdir -p ../urtext/src
          printf '[package]\nname = "urtext"\nversion = "0.0.0"\nedition = "2021"\n' > ../urtext/Cargo.toml
          touch ../urtext/src/lib.rs
      - name: Build and test (lib, integration, examples)
        run: |
          cargo build --release
          cargo test
      - name: Lint (informational, non-blocking)
        continue-on-error: true
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # Secrets are invisible to job-level `if:`, so a tiny job lifts the
  # presence bit into an output the prose job can gate on. When the
  # token is absent the prose job shows SKIPPED in the checks list —
  # visible, unlike a green no-op (the substrate-audit-cron lesson:
  # an unarmed run must not be indistinguishable from a passing one).
  prose-token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - id: probe
        env:
          T: ${{ secrets.URTEXT_READ_TOKEN }}
        run: echo "present=${{ env.T != '' }}" >> "$GITHUB_OUTPUT"

  test-prose:
    # The prose wire and the golden claim-set snapshot
    # (tests/golden_intake.rs) — the pre-merge oracle for route
    # behavior. The 2026-07-30 review found this ran in NO CI anywhere
    # (full-stack.yml is off-default-branch, variable-gated, and
    # token-less); this job is the fix. urtext is private, so it needs
    # the URTEXT_READ_TOKEN repo secret (same shape as harmonics':
    # fine-grained PAT, Contents read-only on nickjoven/urtext).
    # Fork PRs see no secrets and skip — same-repo PRs, pushes, and
    # dispatches gate for real.
    needs: prose-token
    if: needs.prose-token.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: canon.d
      - uses: actions/checkout@v4
        with:
          repository: nickjoven/urtext
          token: ${{ secrets.URTEXT_READ_TOKEN }}
          path: urtext
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: canon.d
      - name: Test with the prose feature (includes the golden snapshot)
        working-directory: canon.d
        run: cargo test --features prose

  heartbeat:
    # The release contract: the constitution must self-host and the four golden
    # vectors must reproduce. A moved vector is a law change, not a test failure
    # to paper over (RELEASE.md). On the nightly schedule this catches drift even
    # when nothing was committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Stub the urtext sibling (see the test job)
        run: |
          mkdir -p ../urtext/src
          printf '[package]\nname = "urtext"\nversion = "0.0.0"\nedition = "2021"\n' > ../urtext/Cargo.toml
          touch ../urtext/src/lib.rs
      - name: Constitution self-host
        run: |
          cargo run -q --bin canon-demo -- constitution --json \
            | python3 -m json.tool \
            | grep -E '"constitution_root"|"keystone_cid"|"self_hosts"|"exit"'
      - name: Golden vectors (the binding drift gate)
        run: cargo test --test golden

  intake-gate:
    # The intake spine's interface contract (INTAKE.md Unit 1 / U5):
    #   exit 0 = clean corpus, exit 1 = findings (needs_review/blocked),
    #   exit 2 = environment error — and the corpus graph is deterministic
    #   (byte-identical across runs). A gate that can't tell "found a problem"
    #   from "couldn't run" is not a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Stub the urtext sibling (see the test job)
        run: |
          mkdir -p ../urtext/src
          printf '[package]\nname = "urtext"\nversion = "0.0.0"\nedition = "2021"\n' > ../urtext/Cargo.toml
          touch ../urtext/src/lib.rs
      - name: Build
        run: cargo build --release --bin canon-demo
      - name: Exit-code contract
        run: |
          B=target/release/canon-demo

          # Clean corpus -> 0
          "$B" intake-corpus tests/fixtures/intake --json > /dev/null

          # W4 typo'd lineage target -> 1, and the finding names the subject
          rc=0
          "$B" intake-corpus tests/fixtures/intake_findings --json > findings.json || rc=$?
          test "$rc" -eq 1
          grep -q unresolved_lineage_target findings.json
          grep -q klein_bottel findings.json

          # Missing input -> 2 (environment error, not a finding)
          rc=0
          "$B" intake-corpus tests/fixtures/no_such_dir --json > /dev/null 2>&1 || rc=$?
          test "$rc" -eq 2
      - name: Graph determinism
        run: |
          B=target/release/canon-demo
          "$B" intake-corpus tests/fixtures/intake --json --emit-graph-json g1.json > /dev/null
          "$B" intake-corpus tests/fixtures/intake --json --emit-graph-json g2.json > /dev/null
          cmp g1.json g2.json
